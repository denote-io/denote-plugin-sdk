name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bundled Node build is current
        run: npm run check:dist

      - name: Frozen API 1 declarations
        run: npm run check:api

      - name: Plugin scaffold builds and packages
        shell: bash
        run: |
          sdk="$(npm pack --silent | tail -n1)"
          scaffold="$RUNNER_TEMP/denote-example"
          node bin/denote-plugin.mjs create "$scaffold" denote.example "Example"
          mv "$sdk" "$scaffold/"
          cd "$scaffold"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));p.dependencies["@denote/plugin-sdk"]="file:./"+process.argv[1];fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")' "$sdk"
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run check
          npm run package
